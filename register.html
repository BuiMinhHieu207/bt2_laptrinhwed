<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - MiniShop</title><link rel="stylesheet" href="css/style.css"><script src="js/main.js" defer></script>
</head>
<body>
<header><div class="container">
    <div class="header-top"><a class="logo" href="index.html">MiniShop</a></div>
    <nav><a href="index.html">Trang chủ</a><a href="about.html">Giới thiệu</a><a href="cart.html">Giỏ hàng (<span id="cart-count">0</span>)</a><a class="active" href="register.html">Đăng ký</a><a href="login.html">Đăng nhập</a><a href="contact.html">Liên hệ</a></nav>
</div></header>
<main class="container">
    <h1 class="page-title">Tạo tài khoản</h1>
    <form class="panel" id="register-form">
        <div class="form-group"><label for="register-name">Họ và tên</label><input id="register-name" type="text" placeholder="Nhập họ tên" required></div>
        <div class="form-group"><label for="register-email">Email</label><input id="register-email" type="email" placeholder="name@example.com" required></div>
        <div class="form-group"><label for="register-password">Mật khẩu</label><input id="register-password" type="password" minlength="6" placeholder="Ít nhất 6 ký tự" required></div>
        <div class="form-group"><label for="register-confirm">Nhập lại mật khẩu</label><input id="register-confirm" type="password" required></div>
        <button type="submit">Đăng ký</button>
        <div id="register-message" aria-live="polite"></div>
        <p>Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
    </form>
</main>
<footer><div class="container">© 2026 MiniShop</div></footer>
</body></html>
