<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - MiniShop</title><link rel="stylesheet" href="css/style.css"><script src="js/main.js" defer></script>
</head>
<body>
<header><div class="container">
    <div class="header-top"><a class="logo" href="index.html">MiniShop</a></div>
    <nav><a href="index.html">Trang chủ</a><a href="about.html">Giới thiệu</a><a href="cart.html">Giỏ hàng (<span id="cart-count">0</span>)</a><a href="register.html">Đăng ký</a><a href="login.html">Đăng nhập</a><a class="active" href="contact.html">Liên hệ</a></nav>
</div></header>
<main class="container">
    <h1 class="page-title">Liên hệ với chúng tôi</h1>
    <form class="panel" id="contact-form">
        <div class="form-group"><label for="contact-name">Họ tên</label><input id="contact-name" type="text" required></div>
        <div class="form-group"><label for="contact-email">Email</label><input id="contact-email" type="email" required></div>
        <div class="form-group"><label for="contact-content">Nội dung</label><textarea id="contact-content" rows="5" placeholder="Nhập nội dung liên hệ..." required></textarea></div>
        <button type="submit">Gửi liên hệ</button>
        <div id="contact-message" aria-live="polite"></div>
    </form>
</main>
<footer><div class="container">© 2026 MiniShop</div></footer>
</body></html>
