<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - MiniShop</title><link rel="stylesheet" href="css/style.css"><script src="js/main.js" defer></script>
</head>
<body>
<header><div class="container">
    <div class="header-top"><a class="logo" href="index.html">MiniShop</a></div>
    <nav><a href="index.html">Trang chủ</a><a href="about.html">Giới thiệu</a><a href="cart.html">Giỏ hàng (<span id="cart-count">0</span>)</a><a href="register.html">Đăng ký</a><a class="active" href="login.html">Đăng nhập</a><a href="contact.html">Liên hệ</a></nav>
</div></header>
<main class="container">
    <h1 class="page-title">Đăng nhập</h1>
    <form class="panel" id="login-form">
        <div class="form-group"><label for="login-email">Email</label><input id="login-email" type="email" placeholder="name@example.com" required></div>
        <div class="form-group"><label for="login-password">Mật khẩu</label><input id="login-password" type="password" required></div>
        <button type="submit">Đăng nhập</button>
        <div id="login-message" aria-live="polite"></div>
        <p>Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
    </form>
</main>
<footer><div class="container">© 2026 MiniShop</div></footer>
</body></html>
